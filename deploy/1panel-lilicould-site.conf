# 1Panel 站点：lilicould.cn
#
# 服务器已确认：
# - OpenResty 是 1Panel Docker 容器（network=host），容器与宿主机共享网络，
#   因此 upstream 可以直接使用 127.0.0.1:3000。
# - 后端 Spring Boot 监听 127.0.0.1:8080。
# - 原站点配置：/opt/1panel/www/conf.d/lilicould.conf
# - 原静态目录：/www/sites/lilicould/index（保留用于回滚）
#
# 使用方式：
# 1. 先备份 1Panel 当前站点配置。
# 2. 在 1Panel「网站 -> 网站 -> lilicould -> 配置文件」中整体替换为下面内容。
# 3. 不要改 SSL 证书路径；由 1Panel 管理证书。
# 4. 保存后使用 1Panel 的重载/重启按钮，不要执行 nginx -s reload（容器内）。
#
# 关键变化：
# - 删除原 try_files 到 /index.html 的 SPA fallback
# - 删除 error_page 404 = @redirect_to_index（否则 Nuxt 404 会被重定向成 302）
# - 删除 location ~* \.(jpg|...|js|css)$（否则会拦截 /_nuxt/*.js|css）
# - /_nuxt/ 和 /vditor/ 代理到 Nuxt
# - /api/、/auth/、/file/ 直接代理到 8080
# - / 及其余路径代理到 Nuxt SSR

server {
    listen 80;
    listen 443 ssl;
    server_name lilicould.cn;

    access_log /www/sites/lilicould/log/access.log main;
    error_log /www/sites/lilicould/log/error.log;

    client_max_body_size 600m;
    client_body_timeout 300s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # ACME 证书续期
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # 敏感文件
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # Nuxt 静态资源（带 hash，长缓存）
    location ^~ /_nuxt/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Vditor 静态资源
    location ^~ /vditor/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 后端 API：浏览器始终请求同源 /api、/auth、/file
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /file/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        client_max_body_size 600m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Nuxt SSR 页面、动态 sitemap/robots、301、404
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    http2 on;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/lilicould/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/lilicould/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    include /www/sites/lilicould/redirect/*.conf;
}
