# 1Panel + OpenResty 站点配置片段
#
# 重要：
# 1. 不要整文件覆盖 1Panel 生成的站点配置；把需要的 location 合并进
#    1Panel「网站 -> 网站 -> 配置文件」对应的 server {} 中。
# 2. 如果 OpenResty 是普通 Docker 网桥模式，upstream 不能用 127.0.0.1
#    （容器里的 127.0.0.1 是容器自己），要改成 host.docker.internal
#    或宿主机在 Docker 网桥中的 IP（常见 172.17.0.1）。
# 3. 如果 OpenResty 容器使用 network=host（当前 lilicould.cn 就是这样），
#    127.0.0.1:3000 可以直接使用。
# 4. HTTPS、证书、HTTP/2 交给 1Panel 管理，不要在这里重复 listen/ssl 配置。

# Nuxt SSR 页面、动态 sitemap/robots、301
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}

# Nuxt 构建产物。若 OpenResty 在 Docker 内，不能直接 alias 宿主机路径，
# 所以这里也走代理；Nuxt 会返回带 hash 的静态资源。
location /_nuxt/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /vditor/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
}

# 可选：Nginx 直接代理后端，减少 Nitro 转发。
# 如果保留这三段，前端浏览器始终请求同源 /api、/auth、/file。
location /api/ {
    proxy_pass https://api.lilicould.cn;
    proxy_ssl_server_name on;
    proxy_set_header Host api.lilicould.cn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /auth/ {
    proxy_pass https://api.lilicould.cn;
    proxy_ssl_server_name on;
    proxy_set_header Host api.lilicould.cn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /file/ {
    proxy_pass https://api.lilicould.cn;
    proxy_ssl_server_name on;
    proxy_set_header Host api.lilicould.cn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    client_max_body_size 600m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
