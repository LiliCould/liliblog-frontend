# LiliBlog Nuxt SSR + Nginx
# 使用前替换：
#   example.com                 站点域名
#   /var/www/liliblog-web       应用目录
#   /etc/letsencrypt/...        HTTPS 证书路径
#   liliblog_backend            后端 API 地址

upstream liliblog_nuxt {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream liliblog_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 600m;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
    gzip_min_length 1024;

    # Nuxt 构建产物：带 hash，可长期缓存
    location /_nuxt/ {
        root /var/www/liliblog-web/.output/public;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Vditor 静态资源
    location /vditor/ {
        root /var/www/liliblog-web/.output/public;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 后端 API：浏览器始终请求同源 /api、/auth、/file
    location /api/ {
        proxy_pass http://liliblog_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /auth/ {
        proxy_pass http://liliblog_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /file/ {
        proxy_pass http://liliblog_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_max_body_size 600m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SSR 页面、动态 sitemap/robots、301、404
    location / {
        proxy_pass http://liliblog_nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
