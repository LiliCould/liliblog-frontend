# LiliBlog Nuxt SSR + Nginx
# 使用前替换：
#   /var/www/liliblog            应用目录
#   /etc/letsencrypt/live/...    HTTPS 证书路径
#   127.0.0.1:3000               Nuxt 监听端口
#   api.lilicould.cn             后端 API 域名

upstream liliblog_nuxt {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name lilicould.cn www.lilicould.cn;

    return 301 https://lilicould.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lilicould.cn;

    ssl_certificate     /etc/letsencrypt/live/lilicould.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lilicould.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 600m;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
    gzip_min_length 1024;

    # Nuxt 构建产物：直接由 Nginx 返回并长缓存
    location /_nuxt/ {
        root /var/www/liliblog/.output/public;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /vditor/ {
        root /var/www/liliblog/.output/public;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 可选：让 Nginx 直接代理后端，减少 Nitro 转发开销。
    # 如果不使用这三段，保留 location / 即可，由 Nuxt 中间件代理。
    location /api/ {
        proxy_pass https://api.lilicould.cn;
        proxy_ssl_server_name on;
        proxy_set_header Host api.lilicould.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /auth/ {
        proxy_pass https://api.lilicould.cn;
        proxy_ssl_server_name on;
        proxy_set_header Host api.lilicould.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /file/ {
        proxy_pass https://api.lilicould.cn;
        proxy_ssl_server_name on;
        proxy_set_header Host api.lilicould.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_max_body_size 600m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SSR 页面、动态 sitemap/robots、301
    location / {
        proxy_pass http://liliblog_nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
