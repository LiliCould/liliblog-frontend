name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Yarn
        run: corepack enable && corepack prepare yarn@4.18.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Deploy Nuxt output
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT || '22' }}
          SOURCE: .output/
          TARGET: /opt/liliblog-web/.output/
          # Windows 本地构建会带绝对路径符号链接，CI 在 Linux 构建；
          # 仍然排除 node_modules 和 source map，运行依赖在服务器上安装。
          ARGS: "-rlgoDzvc --delete --exclude=server/node_modules --exclude=*.map"
          SCRIPT_BEFORE: |
            sudo mkdir -p /opt/liliblog-web
          SCRIPT_AFTER: |
            cd /opt/liliblog-web
            rm -rf .output/server/node_modules
            cp .output/server/package.json package.json
            PATH=/opt/node24/bin:$PATH /opt/node24/bin/npm install --omit=dev --no-audit --no-fund
            sudo chown -R lilicould:lilicould /opt/liliblog-web
            sudo systemctl restart liliblog-web
